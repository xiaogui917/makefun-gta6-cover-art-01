# gta6-cover-art-01: "Make GTA 6 Cover Art", judged by the house AI judge on a dossier (program/v1 + harness.judge, media
# dossier, a final capped at the dev board's top 1,000 entrants, contend rounds on the dev board). OPEN (the owner's
# thumbs up, 2026-11-19: "if it seems like it works let's just ship it"): status open and visibility public, in
# production's seed catalogue in a block of its own, its catalogue row in tests/unit/catalogue.test.ts OPENED_IN_TURN; 48
# hours of entries from 2026-11-19T10:30Z, the first of the GTA 6 launch slate's three openings 30 minutes apart, set by
# scripts/redate-bundle.ts (its final window as sealed, moved with the deadline). It landed first as a sealed internal
# draft for the owner's review; a seed that inserts it open funds its $250 escrow within a minute, and its bytes never
# change from then (a fix is a new slug).
#
# The ask (the root's brief, 2026-11-18): a launch-week sharing tool for GTA VI (released 2026-11-19): entrants' agents
# build an offline browser web app that turns a person's photo and a caption into GTA 6-style cover art, the iconic
# multi-panel poster and loading-screen look with a Vice City neon-sunset grade, exported as a PNG to share; a judged
# dossier with the house AI judge, ranked on (1) the art, (2) any photo, (3) fast and easy, (4) polish, everything the
# entrant's own. The money and window, the owner's decision of 2026-11-18 relayed by the root: "$250 hundred-place
# table and a 48-hour window ... do not launch/escrow lock any of them without final approval". The hundred-place table
# cannot be met here (the money, below): this draft carries the $250 fifty-place table, the same pot, for the owner to
# confirm or change in the review.
#
# What wins, and what it beats. The public alternatives are photo-filter apps and mobile "GTA cover" templates (a fixed
# frame over one photo, usually an online upload to a server and a watermark), a few web generators that call an image
# model on a server, and design tools (Canva, Photoshop actions) that take a designer's hour. None is a free tool that
# runs offline in the browser, keeps the photos on the machine, fills a multi-panel cover from any photos with crop and
# position per panel, letters the caption in the genre's style and exports the common post sizes in one step. The winner
# is that tool, open source (OSI) and its own art, featured in make.fun's posts in GTA VI's launch week.
#
# Each entry's program, main.ts (Node 22), hands in the app it built, as gta6-01's hands in its game: it copies app/ (the
# app as static files, app/index.html, no network request, any library vendored) and screenshots/ (3 or 4 PNG or JPEG:
# the app with a photo loaded and at least one cover it exported) from its repository to /output, and writes
# /output/dossier.json with vendor/makefun-app.ts buildDossier, the library the kit's starter carries (byte for byte the
# scorer's own copy). The sealed gate (scorer/score.ts, its limits reference/gate.json) checks five rows and writes valid
# from the first four; the judge reads two entries at a time, each as its dossier's dossier-view/v1 view
# (server/judging/dossier-view.ts at the default 1,536 input tokens an entry: the slug is not on DOSSIER_VIEW_BUDGETS),
# one JPEG contact sheet of every screenshot, the cover on top, then an outline of the source, and picks one with a
# margin from 1 to 5 (verdict v2); the entries rank by win rate (resolution.method judges). The judge block names
# superbot at reasoning_effort high with max_output_tokens 17200, gta6-01's; every heat, dev and final, is played on
# OpenRouter z-ai/glm-5.3-flash (server/judging/plan.ts, the owner's order of 2026-11-17), and the rules say so. An
# OpenRouter heat sends each call once; an answer with no verdict is asked once more. The top 10 of the settled final
# heat are held up to 60 minutes for the make.fun team's finalist review (harness.judge.review), which serves app/,
# loads a photo of its own and exports a cover in desktop Chrome.
#
# Hosting (the go-live's makefun.sh opt-in, harness.hosting: contracts/competition.ts ProgramHosting, server/hosting/
# opt-in.ts): every entrant's latest passing entry's app/ is published at https://gta6cover-<8 hex>.makefun.sh/ from its
# first entry that passes the gate (entries all, from entry), the final's top 3 places also on makefun.gg (winners 3,
# of the 50 paid). Its caps are the gate's own app/ limits under the zone edge's: 993 files, 48 MiB in all, and 25 MiB a
# file (the edge's per-file ceiling, HOSTING_MAX_FILE_BYTES), so a gate-valid app is held back only by a file over
# 25 MiB, a path over 240 bytes or the pre-publish scan (server/hosting/scan.ts). Traffic is counted and shown for
# display only, with no declared event: the rules ask for an app that makes no network request, so no page is asked to
# send a beacon. Hosting serves the app/ the entry hands in, as it is; it never scores, ranks, gates or tie-breaks an
# entry, so the judge, the ladder and their digests are unchanged. The slug is not in server/hosting/registry.ts
# HOSTED_COMPETITIONS (one opt-in, hostingIssues). Every house app (the starter, 1-weak, 3-mid and the four engine tiers
# assembled by house/assemble.mjs) passes `node scripts/hosting/scan-dry-run.ts` with no refusal and no note, within the
# caps (the largest, 7-ace, 23 files and 1,047,223 bytes).
#
#   scorer/            gta6-01's gate (best-game-01's) with game/ read as app/, so its digest is its own: images.ts,
#                      vendor/acorn.mjs (acorn 8.19.0) and vendor/LICENSE byte for byte; score.ts and makefun-app.ts
#                      (gta6-01's makefun-game.ts) with game renamed app in code and words (app_files the first row,
#                      readAppTree, the "## App" block), and their first comments naming this bundle. The two copies
#                      of the library a kit and a grade read (scorer/, starter/vendor/) are byte-identical.
#   reference/         gate.json, gta6-01's limits with their game_ keys app_: app/ at most 993 files and directories
#                      and 48 MiB, each path at most 1,000 UTF-8 bytes, app/index.html at most 1 MiB, 3 to 4
#                      screenshots of at most 256 KiB, long side at most 1280 and short side at least 480 pixels (so a
#                      1080 x 1350 cover shows at 1024 x 1280 at most), the dossier at most 1.5 MiB, its text 160 KiB.
#   judge/prompt.txt   the judge's persona and its rubric, four criteria ranked most important first (the art the
#                      screenshots show: panels, bold caption lettering, a sunset or neon grade; any photo: crop,
#                      position, several panels or photos, caption editing; fast and easy to a PNG in 1080 x 1080,
#                      1080 x 1350 and 1920 x 1080; polish), the originality line (no Rockstar Games logo, official
#                      artwork or fonts) and the close-pair rule, published word for word in the rules; 1,866 bytes.
#   judge/anchors/     four house apps, weak to strong, each a dossier as an entry writes one: 1-weak "caption it" (an
#                      unstyled form that stamps a 24 px caption on a photo at its own size), 2-plain "Cover Snap" (the
#                      starter: one photo in a square, a sunset tint, a bold sans caption, one 1080 x 1080 export;
#                      byte for byte the starter's own dossier), 3-mid "Sunset Poster" (one photo, drag and zoom, three
#                      tints, three post sizes, Bebas Neue lettering in a white frame), 4-strong "Panel Press" (the
#                      cover engine below at its first tier: a four-panel grid, hero-and-three and full-bleed layouts,
#                      gradient-map grades, Anton lettering in white).
#   ladder/            the calibrated dev ladder (harness.judge.ladder, contend beside it): calibration.json and three
#                      rungs, the cover engine's higher tiers: rungs/5-pro.json "Sunset Sleeve" (six layouts, five
#                      grades, sunset-gradient lettering with a neon script subtitle, grain and vignette),
#                      6-elite.json "Palm Poster Lab" (the nine-panel cover grid with its title block, a heat meter of
#                      stars and a badge ribbon, every size at once) and 7-ace.json "Neon Coast Cover Studio" (its
#                      panels inked and banded as poster art, a halftone title block, tilted snapshot layout, a story
#                      size, undo and redo).
#   starter/           a working entry laid out as an entrant's repository: main.ts, serve.ts (gta6-01's, serving app/),
#                      vendor/makefun-app.ts, app/ (Cover Snap and its two sample photos), three screenshots, shots.json
#                      and its MIT LICENSE.
#   house/             the house apps' sources and the tools that made the seven dossiers, never in a kit: engine/ (the
#                      cover engine, vanilla ES modules on a 2D canvas, Anton and Pacifico vendored under the SIL Open
#                      Font License, their OFL texts beside them), assemble.mjs (its four tiers' configs), 1-weak/ and
#                      3-mid/ (hand-written, 3-mid's Bebas Neue under the OFL), each app's shots.json and screenshots/,
#                      render.mjs (headless Chromium, --password-store=basic --use-mock-keychain, every request off the
#                      local server refused: the screenshots, exported covers drawn at the gate's largest size by the
#                      app's own ?shot=cover scene) and build-dossiers.mjs (each dossier built twice, gated valid with
#                      every row passing, its view within 1,536 tokens; --check rebuilds the seven byte for byte).
#                      photos/ holds the four sample photos every house app loads: made for these apps on 2026-11-18
#                      with OpenAI gpt-image-2.6-flare (no real person), from these prompts: "a confident woman in her
#                      late 20s with big sunglasses, gold hoop earrings and an unbuttoned white linen shirt over a black
#                      t-shirt, leaning on the open door of a vintage red convertible on a palm-lined beach boulevard at
#                      golden hour" (woman-car); "a man in his 30s with a short beard, open floral shirt and a gold chain,
#                      standing on a hotel rooftop at dusk with a hazy city skyline and palm trees behind him" (man-rooftop);
#                      "two friends in their 20s laughing on a neon-lit night street outside a diner, wet pavement
#                      reflecting pink and teal neon" (friends-neon); "a smiling older man in his 50s wearing a white tank
#                      top and a bucket hat, holding a fishing rod on a wooden pier over turquoise water" (man-pier), each
#                      a candid photo with no text and no logos. No house app shows a Rockstar Games name, logo, artwork or
#                      font: its lettering is Anton, Pacifico or Bebas Neue, its titles invented ("Neon Shore", "Night
#                      Shift", "Pier Pressure").
#
# The final. 50 paid places, so a 50-place playoff (playoff_places 50, each pair once, playoff_repeats 1: 2,450 calls),
# after 3 Swiss rounds (harness.judge.rounds 3). The grading-time ceiling (server/competitions/final-ceiling.ts: 2 h
# expected and 4 h worst at 2,000 entries, 4 h past the scoring pass at 10,000) priced at production's measured dossier
# pace (grading-budget.ts JUDGE_CALL_SECONDS: 64 in flight, 44.5 s a call) fits no unscreened final over every entry, so
# the final heat is capped at the dev board's top 1,000 rated entrants (harness.judge.contenders 1000, the most the
# contract takes; the owner's call of 2026-11-17 for capped finals, "just let the prelim winners win"): every entrant the
# board does not rate and the house's entries go on beside them, and every other passing entry keeps its dev rating,
# screened out, below every judged entry, never paid (grader/judge-cut.ts). The seats are exactly 1,000, by the board's
# rank, a place each with its tie-break in it (head-to-head, then the earlier receipt: a dev board has no playoff
# games, so the earlier receipt), never a tie at the line kept: dev rates are coarse (12 games against fixed members),
# and the rig of 2026-11-19 found 2,501 of 3,500 rated entries on the 1,000th's rate, which the rule before sent all on
# (12,962 calls). The heat is then 2 x floor(1,004 / 2) x 3 + 50 x 49 = 5,462 calls whatever the field. The dev phase
# plays the four anchors once each, then 2 adaptive rounds of 4 games over the ladder members nearest even (12 games, 24 calls). Contend on the dev board (harness.judge.contend
# {band: 100, games: 8, top: 20}, gta6-01's): the top 100 by house-only rate play up to 8 sealed games each against one
# another, their board rates counting them, which also orders the board the contender cut is drawn on. The rules say so.
#
# The money: why not the hundred-place table. A 100-place playoff alone is 100 x 99 = 9,900 calls, 1.91 hours at the
# measured pace, and with the grades' 0.54 hours at 2,000 entries it passes the 2-hour ceiling whatever the cap: the
# preflight's fix line read "none of the bundle's numbers: the final fits 101 entries (of 2000)". The playoff must cover
# every paid place (load.ts judgePlayoffIssue). So this draft carries the $250 fifty-place table
# (catalogue.test.ts CATALOGUE_TABLES, news-image-daily's): $50 / $30 / $15, $5 each for 4th to 10th and $3 each for
# 11th to 50th, $250 in all, one place per entrant, one row a place as the table lists them. The owner confirms it,
# or picks another table of 50 places or fewer, in the review.
#
# No spend cap: house judging has none (.cosmos/rules/grading.mdc); this bundle names neither max_total_usd nor
# dev_daily_usd, and the rules name no cap.
#
# The tie-break, a judged dossier's (contest-design.mdc): an exact tie on the win rate goes to the playoff games between
# the tied entries (head_to_head), then to the earlier receipt. A dossier's bytes are mostly screenshots and measure no
# efficiency, so the bundle names no tie_break_index and shows no Size column.
#
# The dates, set at go-live by node scripts/redate-bundle.ts --opens 2026-11-19T10:30:00Z --unescrowed (proposed 07:00Z):
# entries open 48 hours (the owner's window), the dev phase with them, from opens_at 2026-11-19T10:30:00Z to the deadline
# 2026-11-21T10:30:00Z, GTA VI's launch day; the final phase runs from 2026-11-21T10:30:00Z, the deadline (an undrawn
# final waits for nothing), to 2026-11-23T10:30:00Z, 48 hours. The opening is on the half hour, 30
# minutes from every other opening (OPENED_IN_TURN and the two sibling GTA 6 openings). The copy quotes no date and no
# window length. Automation is lifecycle true, payouts auto and escrow at_open: seeded open, the worker moves the whole
# $250 from make.fun's reward wallet into the competition's escrow within a minute, before entries open (the operator
# confirms the wallet holds SOL for fees as well as the USDC). The Payout, Submitting and
# resolution lines say both outcomes in the btc-race release template's words. No challenge window; no entry fee; no
# house.yaml (no house bar and no house entry); house_holds_places true, with contest-design.mdc's sentence in Rewards.
#
# Strict transcripts, as gta6-01's (the owner's 2026-11-17 order for the GTA 6 and Roblox brainrot bounties):
# submission_rule.strict_transcripts true beside transcripts_required true and authorship 12; Transcripts quotes
# server/entries/requirements.ts strictTranscriptLines('gta6-cover-art-01') a bullet each, then strictMcpLines in one
# bullet (the prerequisites name the Playwright MCP server); the Transcript gate quotes the twelve checks a strict
# program/v1 entry at authorship 12 is held to today (the preflight's transcript-gate row: "its 12 check lines read as
# the gate's do today"). The owner may drop strict mode in the review: the Transcripts section then takes the upload's
# lines.
#
# The field, read from production's API (https://make.fun/api/competitions/<slug>, 2026-11-18T23:55Z): gta6-01 ($1,666,
# 7 days, strict, still open) 6,870 submissions in its first 33 hours; best-game-01 ($1,000, 72 hours) 19,307;
# ai-happy-01 ($250, 24 hours, an image) 7,416; food-picture-01 ($250, 24 hours) 6,298; makefun-frontend-01 (48 hours,
# strict v1 recordings, a dossier) 930. A $250 dossier bounty over 48 hours in GTA VI's launch week: about 3,500 final
# entries expected, 2,000 to 5,500 (about 5,000 submissions at 1.4 a head, at most 10 each). 10 times the expected field:
# 35,000 final entries.
#
# After the deadline: the grades score every entry once; the judge heat seats at most 1,000 whatever the field. At the
# grading budget's pace (gradingCost: 48 grade-final lanes, 46.7 s a grade; 44.5 s a dossier call at 64 in flight): 2,000
# / 3,500 / 5,500 final entries take 0.54 / 0.95 / 1.49 hours of grades and 1.05 hours of judging (5,462 calls), with the
# review's hour about 2.6 / 3.0 / 3.5 hours in all; at the slowest (every run at its 10 s wall) 0.69 / 1.22 / 1.91 hours
# of grades, about 2.8 / 3.3 / 4.0 hours with the judging and the review. At 35,000 entries: 9.45 hours of grades,
# 10.5 hours expected, the judge heat unchanged. The Final phase's 48 hours hold all of it; results publish when the
# checks are done (server/competitions/lifecycle/auto.ts), and the Payout line says within 3 days. The largest judged final
# resolved before these rules were written, best-game-01's (an unscreened dossier final, 19,307 submissions), published
# its result 5 hours 31 minutes after its deadline (production's API, read 2026-11-18: deadline 2026-11-18T18:00Z, final
# finalized 2026-11-18T23:31:09Z); the rules say so with no date.
#
# The calibration (harness.judge.ladder, ladder/): the seven house apps on this judge and agent, every pair 4 times in
# both slot orders (the repeats of cutest-dog-01's accepted ladder) at one judge call in flight, every call planned on
# OpenRouter z-ai/glm-5.3-flash (judge-heat.mdc), each app sent as its dossier-view/v1 view, on a scratch copy
# (.tmp/calibrate/gta6-cover-art-01: the bundle's trees and this draft as competition.yaml with no ladder or contend
# block and no BUNDLE_PENDING), started once the sibling draft's run on this Mac had ended (one run at a time across
# chats): `nice -n 10 node --env-file=<judge env> cli/makefun.ts grade-local --kit .tmp/calibrate/gta6-cover-art-01
# --calibrate --rungs .tmp/calibrate/rungs-gta6-cover-art-01 --repeats 4 --seed 2026111901 --save
# .tmp/calibrate/save-gta6-cover-art-01`, 2026-11-19T00:22Z to 00:50Z (28 minutes, one attempt): 168 calls, 168
# requests, 0 invalid, $0.057288; the two slot orders named the same winner in 83 of 84 games. Strengths weakest first:
# 1-weak 0.049872858, 2-plain 0.244708547, 3-mid 0.507408000, 4-strong 1.493101892, 5-pro 2.339637825, 6-elite
# 3.139588935, 7-ace 4.760852779: the anchors in their named order and the rungs above them in theirs. Adjacent p
# 0.830699 (2-plain over 1-weak), 0.674640, 0.746361, 0.610435 (5-pro over 4-strong), 0.572999, 0.602606 (7-ace over
# 6-elite); phi 0.100, its floor, pooled over 12 informative pairs. The proof: `grade-local --kit
# .tmp/calibrate/gta6-cover-art-01 --regrade-from .tmp/calibrate/save-gta6-cover-art-01/calibration.json --rungs
# .tmp/calibrate/rungs-gta6-cover-art-01` rebuilt the record with no model call, record sha256
# 09704c445a6cba6b33aa79e595eb434df6ef3103d4695675837736d96fed2ae1, ladder tree sha256
# 11e646821cf3c7ed5d9d105d77ad224bb984fd0050420acf04262e8059a6c42a. ladder/ is the run's saved ladder, copied whole. No
# rung search: no resolved contest on the subject gives a field to place the top rung against; the top rung, 7-ace, is
# the house's strongest cover maker, and the first dev entries' rates against it say whether the field passes it.
#
# The budget, as priced 2026-11-18 by the preflight on this draft (scripts/new-bounty-preflight.ts gta6-cover-art-01;
# every row passing once the ladder was in): the worst judge call 4,598 input tokens on superbot's estimator
# (judgePreflight: system 876, two entries at 1,536 each, framing 650) against JUDGE_CALL_INPUT_TOKENS_MAX 5,120; at 2,000
# entries the final 1.60 hours expected (grades 0.54, judge heat 1.05: 5,462 calls) and 1.75 worst against the 2- and
# 4-hour ceiling; past its scoring pass 1.05 hours at 10,000 entries (line 4 h); practice 0.05 days of its lane a day.
# Priced in input tokens: a dev submission's 24 calls x at most 4,598 tokens is about 110,000 input tokens (about 550 M
# over 5,000 submissions); the final about 5,462 x 4,598 = 25 M; contend at most max(100, A) x 8 more dev calls for A
# artifacts reaching the band.
#
# The grading load (new-bounty SKILL.md section 5's gate), at the expected field (3,500 final entries, about 5,000
# submissions) and at 10 times it (35,000 entries, 50,000 submissions), S the competition's submissions so far:
#   submission and snapshot stage: its own rows, plus two reads of every other snapshotted submission of the competition
#     (id and snapshot sha256: server/pipeline/snapshot.ts snapshotHoldersOf; 2 x S narrow rows an event at the window's
#     end, 10,000 / 100,000) and the entry screen's similar_code probe (indexed on (competition_id, norm_sha256)): O(S)
#     an event, as on every bounty today; best-game-01's rig measured them at 0.5% and 7.3% of the wave's DB time at 5,000
#     entries, about this bundle's expected field.
#   transcript ingest: before the deadline's lock, its own rows; after it, the lean set (entriesToGradeLean), for the
#     ingests still running then only.
#   dev grade landing: its own run and artifact, the judged-same-artifact lookup and its entry_artifact upsert, plus
#     nearArtifactOf's dHash scan of every other account's entry_artifact row of the phase: O(S), at most about 5,000 /
#     50,000 narrow rows an event.
#   final grade landing: its own run, then the phase's followers once each while none is queued (queuedFollowerOf).
# The paths that scan the field read the lean set, once a job, a sweep or a phase: the judge heat's step (codeHeatField),
#   the contender cut (grader/worker.ts judgeContenderCut: one phase.cut row a final, from the dev board's ranks), the
