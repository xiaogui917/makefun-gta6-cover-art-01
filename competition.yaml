# A house entry holds the place it finishes in, unpaid, and no entry moves up (contest-design.mdc; the Rewards section
# says so).
house_holds_places: true

limits:
  cpus: 1
  memory_mb: 1024
  pids: 64
  wall_budget_sec: 10

min_authored_coverage: 0

# Full auto (the header): the lock, the grades, the judge heat, the publication and the resolve; autopay. Its escrow is
# funded at the deploy that seeds it open (escrow: at_open), within a minute and before entries open: payouts auto then
# pays from the reward wallet only when that escrow was never funded (server/competitions/load.ts escrowAtOpenIssues,
# escrowPayoutsIssue). While the bundle is a draft none of it runs.
automation:
  lifecycle: true
  payouts: auto
  escrow: at_open
